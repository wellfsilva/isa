  <div class="card">
    <h2>Confirmação de Presença</h2>
    
    <form id="formPresenca">
      <div class="field">
        <label for="nome">Seu Nome Completo (obrigatório))</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">
      </div>
      
      <div class="field">
        <label for="acompanhante">Nome do Acompanhante (se houver)</label>

      <button type="submit" id="btnEnviar">Confirmar Presença</button>

  <script>
    // SUBSTiTUA PELO SEU URL DO PASSO 1
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpQDz_3p5zJxWgq2cx3gmWwJOT5Dr6EECwHxbygXpJvEs2ByBzBUNdg905QAdgYOMREQ/exec';

    document.getElementById('formPresenca').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnEnviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      const payload = {
        nome: document.getElementById('nome').value,
        acompanhante: document.getElementById('acompanhante').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('formPresenca').style.display = 'none';
        document.getElementById('mensagemSucesso').style.display = 'block';
      })
      .catch(error => {
        alert('Ocorreu um erro ao enviar. Tente novamente.');
        btn.innerText = 'Confirmar Presença';
        btn.disabled = false;
      });
    });
  </script>
